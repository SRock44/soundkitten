name: build

# Deliberately cheap: type-check + test + `cargo check` only, no full Tauri
# build/bundle. That's expensive (especially macOS runners, billed at a 10x
# minute multiplier) and isn't worth doing on every push/PR -- the full
# 4-platform build+bundle+sign happens once, in release.yml, on version tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Frontend tests
        run: npm run test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
