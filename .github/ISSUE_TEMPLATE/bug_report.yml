name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check whether this might just be SoundCloud's unofficial API behaving unexpectedly (endpoints/behavior can change without notice) rather than a bug in the app itself.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a track's page
        2. Click ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 0.1.0 (Help → About, or the installer filename)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      description: Anything shown in-app, or in the terminal if you ran it from a dev build.
      render: shell
