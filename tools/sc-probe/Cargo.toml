[package]
name = "sc-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rpassword = "7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tiny_http = "0.12"
open = "5"
url = "2"
dotenvy = "0.15"
